<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital knowledge space for women</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Fixed UI Overlays -->
    <header class="navbar">
        <a class="nav-link" href="index.html">what bothers you today?</a>
        <a class="nav-link" href="about.html">about</a>
    </header>

    <aside class="side-nav">
        <a class="button" href="list.html">list &gt;</a>
    </aside>

    <!-- Bottom Interactive Horizontal Scroll / Drag Bar -->
    <footer class="zoom-slider-container" id="zoomSlider">
        <span class="arrow left-arrow">&larr;</span>
        <div class="track-wrapper" id="sliderTrack">
            <div class="line track-line"></div>
            <div class="zoom-handle" id="zoomHandle">
                <span class="zoom-label" id="zoomLabel">[ scroll to zoom - 0% ]</span>
            </div>
        </div>
        <span class="arrow right-arrow">&rarr;</span>
    </footer>

    <!-- Main Canvas Grid -->
    <section class="canvas-wrapper" id="canvasWrapper">
        <div class="canvas" id="canvas">
            <!-- Dynamically populated 100 cards (5 cols x 20 rows) from 15 items -->
        </div>
    </section>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
